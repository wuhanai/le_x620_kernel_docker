name: Build LeEco Le 2 (MT6797) Docker Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & Python 2.7
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            gcc-multilib g++-multilib libc6:i386 libstdc++6:i386 zlib1g:i386 \
            libssl-dev bc liblz4-tool libncurses-dev gcc-aarch64-linux-gnu python3 python3-pip

          echo "[*] Installing Python 2.7 runtime for MTK legacy scripts..."
          mkdir -p /tmp/py2 && cd /tmp/py2
          curl -fsSL -o py2-min.deb http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/libpython2.7-minimal_2.7.18-13ubuntu1.2_amd64.deb || true
          curl -fsSL -o py2-std-min.deb http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7-minimal_2.7.18-13ubuntu1.2_amd64.deb || true
          curl -fsSL -o libpy2.deb http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/libpython2.7-stdlib_2.7.18-13ubuntu1.2_amd64.deb || true
          curl -fsSL -o py2.deb http://archive.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7_2.7.18-13ubuntu1.2_amd64.deb || true
          sudo dpkg -i *.deb 2>/dev/null || true
          cd -
          if [ -x "/usr/bin/python2.7" ]; then
              sudo ln -sf /usr/bin/python2.7 /usr/bin/python2
              sudo ln -sf /usr/bin/python2.7 /usr/bin/python
          else
              sudo ln -sf /usr/bin/python3 /usr/bin/python
          fi
          python --version

      - name: Download Google GCC 4.9 Toolchain
        run: |
          echo "[*] Cloning Google prebuilt aarch64-linux-android-4.9 toolchain..."
          git clone https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 --depth=1 gcc-arm64 || \
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 --depth=1 gcc-arm64
          chmod +x gcc-arm64/bin/* 2>/dev/null || true

      - name: Download MT6797 Linux 3.18 Source Tree
        run: |
          echo "[*] Cloning MT6797 3.18 kernel source..."
          git clone https://github.com/planet-community/android_kernel_planetcom_mt6797.git --depth=1 kernel-src

      - name: Apply Compatibility & Docker Patches
        run: |
          echo "[*] Fixing modern host build compatibility for kernel 3.18 on Ubuntu 22.04..."
          # Fix Perl defined(@val) deprecation error in timeconst.pl
          sed -i 's/defined(@val)/@val/g' kernel-src/kernel/time/timeconst.pl 2>/dev/null || true
          sed -i 's/defined(@val)/@val/g' kernel-src/kernel/timeconst.pl 2>/dev/null || true
          
          # Fix multiple definition of yylloc and add -fcommon to HOSTCFLAGS for GCC 10/11
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' kernel-src/scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' kernel-src/scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/HOSTCFLAGS   := -Wall/HOSTCFLAGS   := -Wall -fcommon/g' kernel-src/Makefile 2>/dev/null || true

          # Create tools directory structure expected by MTK Makefile
          mkdir -p kernel-src/tools/tools
          mkdir -p kernel-src/tools/dct

          # Remove -Werror to prevent warning aborts
          sed -i 's/-Werror//g' kernel-src/Makefile 2>/dev/null || true
          find kernel-src -name Makefile -exec sed -i 's/-Werror//g' {} + 2>/dev/null || true

          # Detect available defconfig
          TARGET_CONFIG="gemini_defconfig"
          if [ ! -f "kernel-src/arch/arm64/configs/$TARGET_CONFIG" ]; then
              FIRST_CFG=$(find kernel-src/arch/arm64/configs -name "*defconfig*" 2>/dev/null | head -n 1)
              if [ -n "$FIRST_CFG" ]; then
                  TARGET_CONFIG=$(basename "$FIRST_CFG")
              else
                  TARGET_CONFIG="defconfig"
              fi
          fi
          echo "[*] Selected target config: $TARGET_CONFIG"
          echo "TARGET_CONFIG=$TARGET_CONFIG" >> $GITHUB_ENV
          if [ -f "kernel-src/arch/arm64/configs/$TARGET_CONFIG" ]; then
              cat docker_defconfig_patch.cfg >> "kernel-src/arch/arm64/configs/$TARGET_CONFIG"
          fi

      - name: Compile Kernel Image
        run: |
          cd kernel-src
          export ARCH=arm64
          
          # Determine working cross-compiler
          if [ -x "../gcc-arm64/bin/aarch64-linux-android-gcc" ]; then
              export CROSS_COMPILE=$(pwd)/../gcc-arm64/bin/aarch64-linux-android-
          else
              echo "[!] Falling back to system aarch64-linux-gnu-"
              export CROSS_COMPILE=aarch64-linux-gnu-
          fi

          echo "[*] Generating configuration using $TARGET_CONFIG..."
          make "$TARGET_CONFIG" || make defconfig
          
          # Ensure Docker configs are active in .config
          cat ../docker_defconfig_patch.cfg >> .config
          make olddefconfig || true

          echo "[*] Compiling Image with $(nproc) threads..."
          make -j$(nproc) Image

      - name: Assemble boot_docker.img
        run: |
          echo "[*] Assembling boot image with extracted le_x620.dtb and ramdisk..."
          python3 repack_bootimg.py kernel-src/arch/arm64/boot/Image le_x620.dtb ramdisk.cpio.gz boot_docker.img
          ls -lh boot_docker.img

      - name: Upload boot_docker.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_docker_le_x620
          path: boot_docker.img
