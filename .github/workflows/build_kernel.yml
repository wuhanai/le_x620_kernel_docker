name: Build LeEco Le 2 (MT6797) Docker Kernel

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-kernel:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies & PyPy 2.7
        run: |
          sudo apt-get update
          sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev \
            libssl-dev bc liblz4-tool libncurses-dev python3

          echo "[*] Installing PyPy 2.7 for legacy MTK build scripts..."
          curl -fsSL https://downloads.python.org/pypy/pypy2.7-v7.3.17-linux64.tar.bz2 | sudo tar -xj -C /usr/local/
          sudo ln -sf /usr/local/pypy2.7-v7.3.17-linux64/bin/pypy /usr/local/bin/python2
          sudo ln -sf /usr/local/pypy2.7-v7.3.17-linux64/bin/pypy /usr/local/bin/python
          sudo ln -sf /usr/local/pypy2.7-v7.3.17-linux64/bin/pypy /usr/bin/python2
          sudo ln -sf /usr/local/pypy2.7-v7.3.17-linux64/bin/pypy /usr/bin/python
          echo "[*] Python 2 environment verified:"
          python --version
          /usr/bin/python --version

      - name: Download LineageOS CM-14.1 GCC 4.9 Toolchain
        run: |
          echo "[*] Cloning LineageOS 14.1 64-bit GCC 4.9 toolchain..."
          git clone https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git -b cm-14.1 --depth=1 gcc-arm64
          chmod +x gcc-arm64/bin/*
          echo "[*] Verifying toolchain version:"
          ./gcc-arm64/bin/aarch64-linux-android-gcc -v

      - name: Download MT6797 Linux 3.18 Source Tree
        run: |
          echo "[*] Cloning MT6797 3.18 kernel source..."
          git clone https://github.com/planet-community/android_kernel_planetcom_mt6797.git --depth=1 kernel-src

      - name: Apply Compatibility & Docker Patches
        run: |
          echo "[*] Fixing modern host build compatibility for kernel 3.18 on Ubuntu 22.04..."
          # Fix Perl defined(@val) deprecation error in timeconst.pl
          sed -i 's/defined(@val)/@val/g' kernel-src/kernel/time/timeconst.pl 2>/dev/null || true
          sed -i 's/defined(@val)/@val/g' kernel-src/kernel/timeconst.pl 2>/dev/null || true
          
          # Fix multiple definition of yylloc and add -fcommon to HOSTCFLAGS for GCC 10/11
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' kernel-src/scripts/dtc/dtc-lexer.lex.c_shipped 2>/dev/null || true
          sed -i 's/YYLTYPE yylloc;/extern YYLTYPE yylloc;/g' kernel-src/scripts/dtc/dtc-lexer.l 2>/dev/null || true
          sed -i 's/HOSTCFLAGS   := -Wall/HOSTCFLAGS   := -Wall -fcommon/g' kernel-src/Makefile 2>/dev/null || true

          # Neutralize POSIX_ACL backport error in MTK ext4
          sed -i 's/#error POSIX_ACL not supported in 3.18 backport/\/\/ posix_acl disabled/g' kernel-src/fs/ext4/inode.c 2>/dev/null || true

          # Precise subsystem-scoped include paths (avoids polluting global LINUXINCLUDE and prevents header shadowing)
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/$(MTK_PLATFORM)' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/include' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v1/src/mach/$(MTK_PLATFORM)' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/base/power/ppm_v1/inc' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/eccci' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/eccci/$(MTK_PLATFORM)' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/conn_md/include' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/cmdq/v2' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/cmdq/v2/$(MTK_PLATFORM)' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/smi' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/mmp' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'subdir-ccflags-y += -I$(srctree)/drivers/misc/mediatek/m4u/$(MTK_PLATFORM)' >> kernel-src/drivers/misc/mediatek/Makefile
          echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/ext_disp/$(MTK_PLATFORM)' >> kernel-src/drivers/misc/mediatek/ext_disp/mt6797/Makefile
          echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/mu3phy' >> kernel-src/drivers/misc/mediatek/mu3phy/Makefile
          echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/uart/mt6797' >> kernel-src/drivers/misc/mediatek/uart/mt6797/Makefile
          echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/uart/mt6797' >> kernel-src/drivers/misc/mediatek/uart/Makefile
          echo 'ccflags-y += -I$(srctree)/drivers/misc/mediatek/usb11' >> kernel-src/drivers/misc/mediatek/usb11/Makefile

          echo 'ccflags-y += -I$(srctree)/drivers/mmc/host/mediatek/mt6797' >> kernel-src/drivers/mmc/host/mediatek/mt6797/Makefile

          # Create tools directory structure expected by MTK Makefile
          mkdir -p kernel-src/tools/tools
          mkdir -p kernel-src/tools/dct

          # Ensure DrvGen.py has correct shebang and permissions
          chmod +x kernel-src/tools/dct/DrvGen.py 2>/dev/null || true
          sed -i '1s|^.*$|#!/usr/bin/env python|' kernel-src/tools/dct/DrvGen.py 2>/dev/null || true

          # Cleanly remove all -Werror and -Werror=... flags without corrupting command line arguments
          find kernel-src -type f \( -name "Makefile*" -o -name "Kbuild*" \) -exec sed -E -i 's/-Werror[-a-zA-Z0-9_=]*//g' {} + 2>/dev/null || true

          # Detect available defconfig
          TARGET_CONFIG="gemini_defconfig"
          if [ ! -f "kernel-src/arch/arm64/configs/$TARGET_CONFIG" ]; then
              FIRST_CFG=$(find kernel-src/arch/arm64/configs -name "*defconfig*" 2>/dev/null | head -n 1)
              if [ -n "$FIRST_CFG" ]; then
                  TARGET_CONFIG=$(basename "$FIRST_CFG")
              else
                  TARGET_CONFIG="defconfig"
              fi
          fi
          echo "[*] Selected target config: $TARGET_CONFIG"
          echo "TARGET_CONFIG=$TARGET_CONFIG" >> $GITHUB_ENV
          if [ -f "kernel-src/arch/arm64/configs/$TARGET_CONFIG" ]; then
              cat docker_defconfig_patch.cfg >> "kernel-src/arch/arm64/configs/$TARGET_CONFIG"
          fi

      - name: Compile Kernel Image
        run: |
          cd kernel-src
          export ARCH=arm64
          export CROSS_COMPILE=$(pwd)/../gcc-arm64/bin/aarch64-linux-android-

          echo "[*] Generating configuration using $TARGET_CONFIG..."
          make python=python "$TARGET_CONFIG" || make python=python defconfig
          
          # Ensure Docker configs are active in .config
          cat ../docker_defconfig_patch.cfg >> .config
          make python=python olddefconfig || true

          echo "[*] Compiling Image with $(nproc) threads..."
          make -j$(nproc) python=python Image
          ls -lh arch/arm64/boot/Image

      - name: Assemble boot_docker.img
        run: |
          echo "[*] Assembling boot image with extracted le_x620.dtb and ramdisk..."
          python3 repack_bootimg.py kernel-src/arch/arm64/boot/Image le_x620.dtb ramdisk.cpio.gz boot_docker.img
          ls -lh boot_docker.img

      - name: Upload boot_docker.img Artifact
        uses: actions/upload-artifact@v4
        with:
          name: boot_docker_le_x620
          path: boot_docker.img
